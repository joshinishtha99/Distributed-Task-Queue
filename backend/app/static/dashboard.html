<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Task Queue Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa4b2;
    --pending: #6b7280; --running: #3b82f6; --completed: #10b981;
    --failed: #f59e0b; --dead: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .conn { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--dead); margin-right: 6px; vertical-align: middle; }
  .dot.live { background: var(--completed); }
  .stats { display: flex; gap: 12px; padding: 20px 28px; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 18px; min-width: 110px; }
  .stat .n { font-size: 26px; font-weight: 600; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.05em; margin-top: 4px; }
  .feed { padding: 8px 28px 40px; }
  .feed h2 { font-size: 14px; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.05em; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 14px;
         background: var(--card); border: 1px solid var(--border);
         border-radius: 8px; margin-bottom: 8px; font-size: 14px;
         animation: flash 0.6s ease; }
  @keyframes flash { from { background: #232a38; } to { background: var(--card); } }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px;
           font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .type { flex: 1; }
  .id { color: var(--muted); font-family: monospace; font-size: 12px; }
  .att { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Distributed Task Queue — Live</h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText">connecting…</span></div>
</header>

<div class="stats" id="stats"></div>

<div class="feed">
  <h2>Live activity</h2>
  <div id="feed"></div>
</div>

<script>
  const counts = { running: 0, completed: 0, failed: 0, dead: 0 };
  const colors = { pending:'#6b7280', running:'#3b82f6', completed:'#10b981',
                   failed:'#f59e0b', dead:'#ef4444' };

  function renderStats() {
    const el = document.getElementById('stats');
    el.innerHTML = '';
    for (const [key, label] of [['running','Running'],['completed','Completed'],
                                ['failed','Failed'],['dead','Dead']]) {
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = `<div class="n" style="color:${colors[key]}">${counts[key]}</div>
                     <div class="l">${label}</div>`;
      el.appendChild(d);
    }
  }
  renderStats();

  function addRow(ev) {
    const feed = document.getElementById('feed');
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="badge" style="background:${colors[ev.status]}22;color:${colors[ev.status]}">${ev.status}</span>
      <span class="type">${ev.task_type}</span>
      <span class="att">attempt ${ev.attempts}</span>
      <span class="id">${ev.id.slice(0,8)}</span>`;
    feed.prepend(row);
    while (feed.children.length > 30) feed.removeChild(feed.lastChild);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => {
      document.getElementById('dot').classList.add('live');
      document.getElementById('connText').textContent = 'live';
    };
    ws.onmessage = (msg) => {
      const ev = JSON.parse(msg.data);
      if (counts[ev.status] !== undefined) counts[ev.status]++;
      renderStats();
      addRow(ev);
    };
    ws.onclose = () => {
      document.getElementById('dot').classList.remove('live');
      document.getElementById('connText').textContent = 'reconnecting…';
      setTimeout(connect, 1500);
    };
  }
  connect();
</script>
</body>
</html>
