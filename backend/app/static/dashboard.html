<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Task Queue Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.5.0/tabler-icons.min.css"/>
<style>
  :root{
    --bg:#0d0f13; --panel:#12151c; --line:#1e222b; --line2:#262b36;
    --text:#e8ebf0; --muted:#6b7280; --dim:#5b6472;
    --running:#3b82f6; --completed:#10b981; --failed:#f59e0b; --dead:#ef4444;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#07090c;color:var(--text);
       font-family:-apple-system,system-ui,sans-serif;padding:24px;}
  .app{max-width:920px;margin:0 auto;background:var(--bg);
       border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:18px 24px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:12px;}
  .mark{width:34px;height:34px;border-radius:9px;background:#171a21;
        border:1px solid var(--line2);display:flex;align-items:center;
        justify-content:center;color:#5b8def;font-size:19px;}
  .title{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
  .sub{font-size:12px;color:var(--muted);}
  .conn{display:flex;align-items:center;gap:7px;padding:6px 12px;
        border-radius:20px;font-size:12px;font-weight:500;
        background:#1a1410;border:1px solid #3a2a18;color:#f59e0b;}
  .conn.live{background:#0f1f16;border-color:#1c3a29;color:#34d399;}
  .pulse{position:relative;width:8px;height:8px;}
  .pulse span{position:absolute;width:8px;height:8px;border-radius:50%;background:currentColor;}
  .pulse span:last-child{opacity:.5;animation:pg 1.8s ease-out infinite;}
  @keyframes pg{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);}
  .stat{background:var(--bg);padding:18px 20px;}
  .stat .lbl{display:flex;align-items:center;gap:7px;margin-bottom:10px;
             font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .stat .n{font-size:30px;font-weight:600;line-height:1;}
  .feedhead{display:flex;align-items:center;justify-content:space-between;
            padding:16px 24px 8px;border-top:1px solid var(--line);
            font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
  .depth{display:flex;align-items:center;gap:5px;color:#4b5563;text-transform:none;letter-spacing:0;}
  .feed{padding:4px 16px 18px;}
  .row{display:flex;align-items:center;gap:14px;padding:11px 12px;
       border-radius:9px;background:var(--panel);margin:6px 0;
       animation:flash .5s ease;}
  @keyframes flash{from{background:#1c222e;}to{background:var(--panel);}}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;
        font-weight:600;padding:4px 11px;border-radius:6px;letter-spacing:0.03em;}
  .type{flex:1;font-size:14px;font-weight:500;}
  .att{font-size:12px;color:var(--muted);padding:3px 9px;}
  .id{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark"><i class="ti ti-stack-2"></i></div>
      <div><div class="title">Task Queue</div><div class="sub">distributed worker platform</div></div>
    </div>
    <div class="conn" id="conn"><span class="pulse"><span></span><span></span></span><span id="connText">connecting…</span></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="feedhead">
    <span>Live activity</span>
    <span class="depth"><i class="ti ti-layers-subtract" style="font-size:14px"></i>queue depth <span id="depth">0</span></span>
  </div>
  <div class="feed" id="feed"></div>
</div>

<script>
  const counts={running:0,completed:0,failed:0,dead:0};
  const meta={
    running:{c:'#3b82f6',i:'ti-clock-play',l:'Running'},
    completed:{c:'#10b981',i:'ti-circle-check',l:'Completed'},
    failed:{c:'#f59e0b',i:'ti-alert-triangle',l:'Failed'},
    dead:{c:'#ef4444',i:'ti-skull',l:'Dead'},
  };
  const pillBg={running:'#14243d',completed:'#0f2a1e',failed:'#2a2010',dead:'#3a1616'};

  function renderStats(){
    const el=document.getElementById('stats');el.innerHTML='';
    for(const k of ['running','completed','failed','dead']){
      const m=meta[k];
      const d=document.createElement('div');d.className='stat';
      d.innerHTML=`<div class="lbl"><i class="ti ${m.i}" style="color:${m.c};font-size:15px"></i>${m.l}</div>
                   <div class="n" style="color:${m.c}">${counts[k]}</div>`;
      el.appendChild(d);
    }
  }
  renderStats();

  function addRow(ev){
    const feed=document.getElementById('feed');
    const m=meta[ev.status]||meta.running;
    const label=ev.status==='completed'?'DONE':ev.status.toUpperCase();
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`
      <span class="pill" style="background:${pillBg[ev.status]};color:${m.c}"><i class="ti ${m.i}" style="font-size:13px"></i>${label}</span>
      <span class="type">${ev.task_type}</span>
      <span class="att">attempt ${ev.attempts}/3</span>
      <span class="id">${ev.id.slice(0,8)}</span>`;
    feed.prepend(row);
    while(feed.children.length>25)feed.removeChild(feed.lastChild);
    [...feed.children].forEach((r,i)=>{r.style.opacity=Math.max(0.35,1-i*0.06);});
  }

  function connect(){
    const proto=location.protocol==='https:'?'wss':'ws';
    const ws=new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen=()=>{document.getElementById('conn').classList.add('live');
                  document.getElementById('connText').textContent='live';};
    ws.onmessage=(msg)=>{const ev=JSON.parse(msg.data);
      if(counts[ev.status]!==undefined)counts[ev.status]++;
      renderStats();addRow(ev);};
    ws.onclose=()=>{document.getElementById('conn').classList.remove('live');
                    document.getElementById('connText').textContent='reconnecting…';
                    setTimeout(connect,1500);};
  }
  connect();
</script>
</body>
</html>
